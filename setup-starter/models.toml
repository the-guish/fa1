# The models the agents may use. A provider is "anthropic" (the Anthropic API key),
# "claude-code" (the Claude Code token) or "cursor" (the Cursor API key).

[models.sonnet]
provider = "anthropic"
name = "claude-sonnet-5-5"
title = "Claude Sonnet 5.5"
timeout_seconds = 600

[models.opus]
provider = "anthropic"
name = "claude-opus-5-5"
title = "Claude Opus 5.5"
timeout_seconds = 600

[models.cc-opus]
provider = "claude-code"
name = "claude-opus-5-5"
title = "Claude Opus 5.5 (Claude Code)"

[models.cc-sonnet]
provider = "claude-code"
name = "claude-sonnet-5-5"
title = "Claude Sonnet 5.5 (Claude Code)"

[models.cc-haiku]
provider = "claude-code"
name = "claude-haiku-5-5"
title = "Claude Haiku 5.5 (Claude Code)"

# Cursor's models, for the agents on the Cursor worker. A name is one `cursor-agent models`
# lists for your account.
[models.cursor-auto]
provider = "cursor"
name = "auto"
title = "Auto (Cursor)"

[models.cursor-composer]
provider = "cursor"
name = "composer-2.5"
title = "Composer 2.5 (Cursor)"

[models.cursor-grok]
provider = "cursor"
name = "grok-4.7-high"
title = "Grok 4.7 High (Cursor)"

# Cursor runs a model only when your plan includes it.
[models.cursor-gemini]
provider = "cursor"
name = "gemini-3.1-pro"
title = "Gemini 3.1 Pro (Cursor)"
