[project]
name = "fa1-claude-cloud"
version = "0.1.0"
description = "FA1's claude-cloud engine: a conversation is a cloud session of Claude Code."
requires-python = ">=3.12"
# Nothing beyond the code worker's image: Robinauts' engine contract and its Claude Code
# worker are there already, and the image installs this package without dependencies.
dependencies = []

[project.entry-points."robinauts.engines"]
claude-cloud = "fa1_cloud.engine:init_claude_cloud"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fa1_cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

# Robinauts' rules for its extra workers (extra-workers/claude-code-worker/pyproject.toml).
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["fa1_cloud"]
known-third-party = ["robinauts", "robinauts_claude_worker"]
