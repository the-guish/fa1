# Robinauts' configuration in mode 2: the control plane's and the code worker's, the same file.
# The keys are named here and set in their containers by the app (docs/specs/containers.md).

# --- the model providers ------------------------------------------------------------------------

# Anthropic's API, for the assistant. The person's API key.
[model_providers.anthropic]
kind = "anthropic"
api_key_env = "FA1_ANTHROPIC_KEY"

# Anthropic, for the Claude Code worker alone, which signs in with the person's Claude Code token.
# ANTHROPIC_API_KEY stays unset: the worker refuses a key beside the token.
[model_providers.claude-code]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

# --- the models ---------------------------------------------------------------------------------

[models.sonnet]
provider = "anthropic"
name = "claude-sonnet-5-5"
title = "Claude Sonnet 5.5"
timeout_seconds = 600

[models.opus]
provider = "anthropic"
name = "claude-opus-5-5"
title = "Claude Opus 5.5"
timeout_seconds = 600

[models.cc-opus]
provider = "claude-code"
name = "claude-opus-5-5"
title = "Claude Opus 5.5 (Claude Code)"

[models.cc-sonnet]
provider = "claude-code"
name = "claude-sonnet-5-5"
title = "Claude Sonnet 5.5 (Claude Code)"

# --- the agents ---------------------------------------------------------------------------------

[agents.assistant]
title = "Assistant"
engine = "pydantic-ai"
models = ["sonnet", "opus"]
tools = ["fetch", "browser", "files", "todo", "diagrams", "sessions"]
turn_timeout_seconds = 1800
system_prompt = """
You are the person's assistant. Answer briefly, and link the pages your answer rests on.

Your tools:
- fetch: reads a page as text. Use it for most pages.
- browser_*: a real browser. Use it when fetch fails or the page needs JavaScript.
- files: the folder /agents-fs, which you keep for the person. Say the path of each file you write.
- show_todos, add_todo, toggle_todo, remove_todo: the to-do list the person sees in the side panel.
- show_diagram, draw_diagram, add_to_diagram, remove_from_diagram: a diagram in the side panel.
- search_sessions: words in the person's earlier conversations.
"""

# The coding agent: Claude Code in the code worker's container, in this conversation's own
# directory.
[agents.claude-code]
title = "Claude Code"
engine = "claude-code"
models = ["cc-opus", "cc-sonnet"]
worker = "claude"
tools = ["sessions"]
turn_timeout_seconds = 1800
system_prompt = """
You work in this conversation's own directory. Say what you did.

Git and GitHub:
- git is set up for https://github.com URLs. Clone a repository over HTTPS into this directory.
- Work on a new branch and push that branch. Never push to the default branch.
- Never print the token in GITHUB_TOKEN or write it to a file.
"""

# --- the tool servers: the project's MCP servers, by their service names ----------------------

[tool_servers.fetch]
url = "http://fetch:8932/mcp"
auth = "none"
timeout_seconds = 60

[tool_servers.browser]
url = "http://browser:8931/mcp"
auth = "none"
timeout_seconds = 120

[tool_servers.files]
url = "http://files:8935/mcp"
secret_env = "FA1_FILES_KEY"
timeout_seconds = 30

[tool_servers.todo]
url = "http://todo:8936/mcp"
auth = "none"
timeout_seconds = 30

[tool_servers.diagrams]
url = "http://diagrams:8937/mcp"
auth = "none"
timeout_seconds = 30

# --- the workers --------------------------------------------------------------------------------

# The code worker runs in its own container, which the app starts with a token it created.
[workers.claude]
external = true
