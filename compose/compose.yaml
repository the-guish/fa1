# FA1's mode 2: the control plane and the code worker in containers (docs/specs/containers.md).
# The app runs this project as `fa1`, with these variables:
#
#   FA1_PORT        the port of the front listener, on the host's 127.0.0.1 and in `control`
#   FA1_SECRETS     the app's secrets folder: control.env, code.env, files.env, setup.env, launch,
#                   worker_token
#   FA1_SETUP       the person's setup folder, on the host
#   FA1_UID         the user that owns the setup folder, and FA1_GID, its group: the services
#                   that reach the folder run as that user
#
# Every image is built here, from Robinauts at the pinned commit and from this folder. `apps/`
# holds FA1's own image of the control plane: its applications, and its host of them.

name: fa1

x-robinauts: &robinauts https://github.com/the-guish/robinauts.git#1d0f49f3474a094c332010fa46308a563d43216a

x-mcp: &mcp
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  mem_limit: 512m
  pids_limit: 256
  restart: unless-stopped

services:
  # Gives the volumes of the services below to the setup folder's owner, since those services
  # run as that user. It ends at once.
  owner:
    build: ./setup-tools
    user: root
    entrypoint: [chown, -R, "${FA1_UID:?}:${FA1_GID:?}", /work, /var/lib/robinauts]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    volumes:
      - setup-work:/work
      - control-data:/var/lib/robinauts
    restart: "no"

  # The control plane, in the local mode, on SQLite. The front listener is published on the
  # host's loopback. The worker listener is on the container's loopback: `code` shares this
  # container's network and reaches it there.
  control:
    # FA1's own image: Robinauts and neorc as parts, FA1's applications beside them, and
    # backend.py, which composes them (docs/specs/apps.md).
    build:
      context: ./apps
      additional_contexts:
        robinauts: *robinauts
    command:
      - sh
      - -c
      - >-
        exec python /opt/fa1/apps/backend.py --port ${FA1_PORT:?} --worker-port 8421
        < /run/secrets/launch
    # The setup folder's owner: the review app writes the folder (docs/specs/review-app.md).
    user: "${FA1_UID:?}:${FA1_GID:?}"
    environment:
      HOME: /var/lib/robinauts
      ROBINAUTS_CONFIG: /etc/fa1/robinauts.toml
      ROBINAUTS_DATA_DIR: /var/lib/robinauts/data
      # The flows, from the setup folder: the server uploads them to neorc at its start, and
      # runs neorc's worker beside itself, with the handlers of flows/handlers/.
      ROBINAUTS_FLOWS_DIR: /etc/fa1/flows
      # The review app (docs/specs/review-app.md): the designer's working copy of the setup
      # folder, which it fetches branches from, and the person's setup folder, which an
      # approval fast-forwards.
      REVIEWS_WORK: /work/setup
      REVIEWS_SETUP: /setup
    env_file: ${FA1_SECRETS:?}/control.env
    secrets: [launch]
    volumes:
      - ./robinauts.toml:/etc/fa1/robinauts.toml:ro
      - ./flows:/etc/fa1/flows:ro
      - ${FA1_SETUP:?}:/setup
      - control-data:/var/lib/robinauts
      - setup-work:/work:ro
    depends_on:
      owner:
        condition: service_completed_successfully
      setup-git:
        condition: service_started
    ports:
      - 127.0.0.1:${FA1_PORT:?}:${FA1_PORT:?}
    restart: unless-stopped

  # The Claude Code worker. It reads its token from a file, and reaches the worker listener on
  # 127.0.0.1, a broker the personal sign-in accepts.
  code:
    build:
      context: *robinauts
      dockerfile: extra-workers/claude-code-worker/Dockerfile
    network_mode: service:control
    depends_on: [control]
    environment:
      ROBINAUTS_CONFIG: /etc/fa1/robinauts.toml
      ROBINAUTS_WORKER_NAME: claude
      ROBINAUTS_WORKER_BROKER_URL: http://127.0.0.1:8421/robinauts
      # The flows' settings, as the server reads them: their [repositories] are the ones a
      # conversation gets a worktree of, and the ones a code task may name.
      ROBINAUTS_FLOWS_DIR: /etc/fa1/flows
      ONEBERTH_TOKEN_FILE: /run/secrets/worker_token
      ROBINAUTS_CLAUDE_AUTH: personal
      ROBINAUTS_CLAUDE_PERMISSION_MODE: bypassPermissions
      # git sends GITHUB_TOKEN to github.com when the agent's git asks for a password.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: credential.https://github.com.helper
      GIT_CONFIG_VALUE_0: "!f() { echo username=x-access-token; echo password=$$GITHUB_TOKEN; }; f"
    env_file: ${FA1_SECRETS:?}/code.env
    secrets: [worker_token]
    volumes:
      - ./robinauts.toml:/etc/fa1/robinauts.toml:ro
      - ./flows:/etc/fa1/flows:ro
      - code-claude:/var/lib/claude
      - code-workspaces:/workspace
    restart: unless-stopped

  fetch:
    <<: *mcp
    build: ./fetch

  # Playwright MCP, headless Chromium. Its image adds --headless --browser chromium --no-sandbox.
  browser:
    <<: *mcp
    image: mcr.microsoft.com/playwright/mcp:v0.0.85
    command: [--isolated, --host, 0.0.0.0, --port, "8931", --allowed-hosts, "browser:8931"]
    mem_limit: 1g
    tmpfs: [/tmp, /home/pwuser]

  files:
    <<: *mcp
    build: ./files
    env_file: ${FA1_SECRETS:?}/files.env
    volumes:
      - files:/agents-fs

  # The designer's working copy of the setup folder, and its two tool servers: the reference
  # filesystem server and the reference git server (docs/specs/review-app.md). The git server
  # reads the setup folder, and brings the working copy's main to the folder's commit. Both
  # run as the setup folder's owner, so the review app fetches from the working copy.
  setup-git:
    <<: *mcp
    build: ./setup-tools
    command: [git]
    user: "${FA1_UID:?}:${FA1_GID:?}"
    environment:
      HOME: /tmp
      GIT_AUTHOR_NAME: Flow designer
      GIT_AUTHOR_EMAIL: flow-designer@fa1.invalid
      GIT_COMMITTER_NAME: Flow designer
      GIT_COMMITTER_EMAIL: flow-designer@fa1.invalid
    env_file: ${FA1_SECRETS:?}/setup.env
    volumes:
      - setup-work:/work
      - ${FA1_SETUP:?}:/setup:ro
    depends_on:
      owner:
        condition: service_completed_successfully

  setup-files:
    <<: *mcp
    build: ./setup-tools
    command: [files]
    user: "${FA1_UID:?}:${FA1_GID:?}"
    environment:
      HOME: /tmp
    env_file: ${FA1_SECRETS:?}/setup.env
    volumes:
      - setup-work:/work
    depends_on: [setup-git]

  todo:
    <<: *mcp
    build:
      context: ./todo
      additional_contexts:
        source: https://github.com/the-guish/robinauts.git#1d0f49f3474a094c332010fa46308a563d43216a:mcp/to-do-list
    volumes:
      - todos:/data

  diagrams:
    <<: *mcp
    build:
      context: ./diagrams
      additional_contexts:
        source: https://github.com/the-guish/robinauts.git#1d0f49f3474a094c332010fa46308a563d43216a:mcp/diagrams

secrets:
  launch:
    file: ${FA1_SECRETS:?}/launch
  worker_token:
    file: ${FA1_SECRETS:?}/worker_token

volumes:
  control-data: {}
  code-claude: {}
  code-workspaces: {}
  files: {}
  setup-work: {}
  todos: {}
